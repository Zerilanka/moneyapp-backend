services:
  db:
    image: postgres:15-alpine
    container_name: moneyapp_postgres
    environment:
      POSTGRES_USER: money_user
      POSTGRES_PASSWORD: secure_password_2026
      POSTGRES_DB: moneyapp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build: .
    container_name: moneyapp_backend
    ports:
      - "4000:4000"
    environment:
      - DB_HOST=db
      - DB_USER=money_user
      - DB_PASSWORD=secure_password_2026
      - DB_NAME=moneyapp_db
    depends_on:
      - db
    restart: always

volumes:
  postgres_data: